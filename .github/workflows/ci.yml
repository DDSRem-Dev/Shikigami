name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  homebrew:
    # Release calls this CI on a tag before publishing its assets. Only branch
    # pushes and PRs test the already-public channel, avoiding a release cycle.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))
    name: homebrew (${{ matrix.goos }}, ${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - runner: macos-15
            goos: darwin
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
    steps:
      - name: Test already-published homebrew alpha channel for ${{ matrix.goos }}/${{ matrix.goarch }}
        run: |
          case "${{ matrix.goos }}" in
            darwin) brew tap DDSRem-Dev/shikigami https://github.com/DDSRem-Dev/homebrew-shikigami.git
                    brew install --formula DDSRem-Dev/shikigami/shikigami
                    shiki version ;;
            linux)  case "${{ matrix.goarch }}" in
                      amd64) arch=x86_64 ;;
                      arm64) arch=aarch64 ;;
                    esac
                    curl -fsSL "https://github.com/DDSRem-Dev/homebrew-shikigami/raw/main/install-linux-${arch}.sh" | bash
                    ~/.shikigami/bin/shiki version ;;
          esac
      - name: Record homebrew result
        if: ${{ !cancelled() }}
        run: |
          mkdir -p homebrew-result
          echo '{"channel":"alpha","state":"${{ job.status }}"}' > homebrew-result/result.json
      - uses: actions/upload-artifact@v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: homebrew-${{ matrix.goos }}-${{ matrix.goarch }}
          path: homebrew-result/
          if-no-files-found: error
          retention-days: 14
  compile:
    name: compile (${{ matrix.goos }}, ${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15
            goos: darwin
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1 -mod=readonly -buildvcs=false'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Record cache keys for build and module downloads
        id: cache_keys
        continue-on-error: true
        timeout-minutes: 1
        run: python3 -B scripts/ci_go_cache.py keys
      - name: Restore downloaded Go modules
        id: module_cache
        if: steps.cache_keys.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.cache_keys.outputs.module_path }}
          key: ${{ steps.cache_keys.outputs.module_warm_key }}
          restore-keys: ${{ steps.cache_keys.outputs.module_prefix }}
      - name: Restore native Go build cache
        id: build_cache
        if: steps.cache_keys.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.cache_keys.outputs.build_path }}
          key: ${{ steps.cache_keys.outputs.build_warm_key }}
          restore-keys: |
            ${{ steps.cache_keys.outputs.build_source_prefix }}
            ${{ steps.cache_keys.outputs.build_prefix }}
      - name: Record restored Go build entries
        id: cache_baseline
        if: steps.module_cache.outcome == 'success' && steps.build_cache.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        env:
          SHIKI_BUILD_CACHE_HIT: ${{ steps.build_cache.outputs.cache-hit }}
          SHIKI_MODULE_CACHE_HIT: ${{ steps.module_cache.outputs.cache-hit }}
          SHIKI_BUILD_CACHE_MATCHED: ${{ steps.build_cache.outputs.cache-matched-key }}
          SHIKI_MODULE_CACHE_MATCHED: ${{ steps.module_cache.outputs.cache-matched-key }}
        run: python3 -B scripts/ci_go_cache.py baseline
      - name: Cross-compile native binaries
        run: make build
      - name: Determine changed build entries eligible to save
        id: cache_plan
        if: ${{ !cancelled() && steps.cache_baseline.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 1
        run: python3 -B scripts/ci_go_cache.py plan
      - name: Check whether this build cache already exists
        id: cache_present
        if: ${{ !cancelled() && steps.cache_plan.outcome == 'success' && steps.cache_plan.outputs.save_build == 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.cache_keys.outputs.build_path }}
          key: ${{ steps.cache_plan.outputs.build_save_key }}
          lookup-only: true
      - name: Save compiled native Go entries, including after test failure
        if: ${{ !cancelled() && steps.cache_present.outcome == 'success' && steps.cache_present.outputs.cache-hit != 'true' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ steps.cache_keys.outputs.build_path }}
          key: ${{ steps.cache_plan.outputs.build_save_key }}
  test:
    name: test (${{ matrix.shard }}, ${{ matrix.goos }}, ${{ matrix.goarch }})
    needs: compile
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          # Linux amd64 shards
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            shard: unit
            packages: ./cmd/... ./internal/... ./pkg/... ./plugins/... ./test/architecture/... ./test/diagnostics/... ./test/fault/... ./test/fixtures/... ./test/integration/admission/... ./test/integration/agent/... ./test/integration/daemon/... ./test/integration/port/... ./test/integration/rotation/... ./test/integration/terminalstate/...
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            shard: integration
            packages: ./test/integration/hostrotation/... ./test/integration/version/... ./test/integration/plugin/... ./test/integration/syncack/... ./test/integration/sync/... ./test/e2e/...
          # Linux arm64 shards
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            shard: unit
            packages: ./cmd/... ./internal/... ./pkg/... ./plugins/... ./test/architecture/... ./test/diagnostics/... ./test/fault/... ./test/fixtures/... ./test/integration/admission/... ./test/integration/agent/... ./test/integration/daemon/... ./test/integration/port/... ./test/integration/rotation/... ./test/integration/terminalstate/...
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            shard: integration
            packages: ./test/integration/hostrotation/... ./test/integration/version/... ./test/integration/plugin/... ./test/integration/syncack/... ./test/integration/sync/... ./test/e2e/...
          # Darwin arm64 shards
          - runner: macos-15
            goos: darwin
            goarch: arm64
            shard: unit
            packages: ./cmd/... ./internal/... ./pkg/... ./plugins/... ./test/architecture/... ./test/diagnostics/... ./test/fault/... ./test/fixtures/... ./test/integration/admission/... ./test/integration/agent/... ./test/integration/daemon/... ./test/integration/port/... ./test/integration/rotation/... ./test/integration/terminalstate/...
          - runner: macos-15
            goos: darwin
            goarch: arm64
            shard: integration
            packages: ./test/integration/hostrotation/... ./test/integration/version/... ./test/integration/plugin/... ./test/integration/syncack/... ./test/integration/sync/... ./test/e2e/...
          # Darwin amd64 shards
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            shard: unit
            packages: ./cmd/... ./internal/... ./pkg/... ./plugins/... ./test/architecture/... ./test/diagnostics/... ./test/fault/... ./test/fixtures/... ./test/integration/admission/... ./test/integration/agent/... ./test/integration/daemon/... ./test/integration/port/... ./test/integration/rotation/... ./test/integration/terminalstate/...
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            shard: integration
            packages: ./test/integration/hostrotation/... ./test/integration/version/... ./test/integration/plugin/... ./test/integration/syncack/... ./test/integration/sync/... ./test/e2e/...
    runs-on: ${{ matrix.runner }}
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1 -mod=readonly -buildvcs=false'
      GOTOOLCHAIN: local
      SHIKI_PLATFORM_OS: ${{ matrix.goos }}
      SHIKI_PLATFORM_ARCH: ${{ matrix.goarch }}
      SHIKI_PLATFORM_JOB_STATUS: ${{ job.status }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Record cache keys
        id: cache_keys
        continue-on-error: true
        timeout-minutes: 1
        run: python3 -B scripts/ci_go_cache.py keys
      - name: Restore Go modules
        if: steps.cache_keys.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.cache_keys.outputs.module_path }}
          key: ${{ steps.cache_keys.outputs.module_warm_key }}
          restore-keys: ${{ steps.cache_keys.outputs.module_prefix }}
      - name: Restore Go build cache
        if: steps.cache_keys.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.cache_keys.outputs.build_path }}
          key: ${{ steps.cache_keys.outputs.build_warm_key }}
          restore-keys: |
            ${{ steps.cache_keys.outputs.build_source_prefix }}
            ${{ steps.cache_keys.outputs.build_prefix }}
      - name: Preflight checks and resource detection
        run: python3 -B scripts/platform-ci.py preflight --evidence "$RUNNER_TEMP/shiki-platform"
      - name: Run ${{ matrix.shard }} test shard
        run: python3 -B scripts/platform-ci.py product --evidence "$RUNNER_TEMP/shiki-platform" --package-filter "${{ matrix.packages }}"
      - name: Verify terminal screen semantics
        run: python3 -B scripts/platform-ci.py terminal --evidence "$RUNNER_TEMP/shiki-platform"
      - name: Verify source identity and record shard acceptance
        id: acceptance
        if: ${{ !cancelled() }}
        run: python3 -B scripts/platform-ci.py finalize --evidence "$RUNNER_TEMP/shiki-platform"
      - uses: actions/upload-artifact@v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: platform-${{ matrix.shard }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.acceptance.outputs.evidence }}
          if-no-files-found: error
          retention-days: 14
  maintenance:
    name: maintenance (${{ matrix.goos }}, ${{ matrix.goarch }})
    needs: compile
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15
            goos: darwin
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
    runs-on: ${{ matrix.runner }}
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1 -mod=readonly -buildvcs=false'
      GOTOOLCHAIN: local
      SHIKI_PLATFORM_OS: ${{ matrix.goos }}
      SHIKI_PLATFORM_ARCH: ${{ matrix.goarch }}
      SHIKI_PLATFORM_JOB_STATUS: ${{ job.status }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Record cache keys
        id: cache_keys
        continue-on-error: true
        timeout-minutes: 1
        run: python3 -B scripts/ci_go_cache.py keys
      - name: Restore Go modules
        if: steps.cache_keys.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.cache_keys.outputs.module_path }}
          key: ${{ steps.cache_keys.outputs.module_warm_key }}
          restore-keys: ${{ steps.cache_keys.outputs.module_prefix }}
      - name: Restore Go build cache
        if: steps.cache_keys.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.cache_keys.outputs.build_path }}
          key: ${{ steps.cache_keys.outputs.build_warm_key }}
          restore-keys: |
            ${{ steps.cache_keys.outputs.build_source_prefix }}
            ${{ steps.cache_keys.outputs.build_prefix }}
      - name: Preflight checks and resource detection
        run: python3 -B scripts/platform-ci.py preflight --evidence "$RUNNER_TEMP/shiki-platform"
      - name: Native installation and service lifecycle maintenance
        run: python3 -B scripts/platform-ci.py maintenance --evidence "$RUNNER_TEMP/shiki-platform"
      - name: Verify source identity and record maintenance acceptance
        id: acceptance
        if: ${{ !cancelled() }}
        run: python3 -B scripts/platform-ci.py finalize --evidence "$RUNNER_TEMP/shiki-platform"
      - uses: actions/upload-artifact@v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: platform-maintenance-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.acceptance.outputs.evidence }}
          if-no-files-found: error
          retention-days: 14
  test-wsl:
    name: test (WSL2, linux, amd64)
    needs: compile
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      SHIKI_PLATFORM_JOB_STATUS: ${{ job.status }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Native WSL2 product, terminal and systemd maintenance
        id: wsl
        shell: pwsh
        run: |
          $evidence = & pwsh -File scripts/platform-wsl.ps1
          "evidence=$evidence" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: platform-wsl2-linux-amd64
          path: ${{ steps.wsl.outputs.evidence }}
          if-no-files-found: error
          retention-days: 14

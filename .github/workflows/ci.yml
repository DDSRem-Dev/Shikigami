name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  homebrew:
    # Release calls this CI on a tag before publishing its assets. Only branch
    # pushes and PRs test the already-public channel, avoiding a release cycle.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))
    name: homebrew (${{ matrix.goos }}, ${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: macos-15
            goos: darwin
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
    env:
      SHIKI_CHANNEL_OS: ${{ matrix.goos }}
      SHIKI_CHANNEL_ARCH: ${{ matrix.goarch }}
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test the fixed public Homebrew formula on the native runner
        timeout-minutes: 30
        run: |
          python3 -B scripts/test-homebrew-channel.py run \
            --evidence "$RUNNER_TEMP/shiki-homebrew-channel" --checkout "$GITHUB_WORKSPACE" \
            --os "$SHIKI_CHANNEL_OS" --arch "$SHIKI_CHANNEL_ARCH"
      - name: Finish cleanup of only this run's owned Homebrew objects
        if: always() && steps.checkout.outcome == 'success'
        timeout-minutes: 10
        run: |
          python3 -B scripts/test-homebrew-channel.py cleanup \
            --evidence "$RUNNER_TEMP/shiki-homebrew-channel" \
            --os "$SHIKI_CHANNEL_OS" --arch "$SHIKI_CHANNEL_ARCH"
      - uses: actions/upload-artifact@v7.0.2
        if: always() && steps.checkout.outcome == 'success'
        with:
          name: homebrew-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ runner.temp }}/shiki-homebrew-channel/**
            !${{ runner.temp }}/shiki-homebrew-channel/private/**
          if-no-files-found: warn
          retention-days: 14
  test:
    name: test (${{ matrix.goos }}, ${{ matrix.goarch }})
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15
            goos: darwin
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
    runs-on: ${{ matrix.runner }}
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1 -mod=readonly -buildvcs=false'
      GOTOOLCHAIN: local
      SHIKI_PLATFORM_OS: ${{ matrix.goos }}
      SHIKI_PLATFORM_ARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
      - name: Verify actual native platform and freeze source identity
        run: python3 -B scripts/platform-ci.py preflight --evidence "$RUNNER_TEMP/shiki-platform"
      - name: Install runtime test dependencies
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y tmux unzip iproute2 dbus-user-session openssl
          elif ! command -v tmux; then
            brew install tmux
          fi
      - run: make tools generate-proto
      - name: Check generated protocol drift
        run: git diff --exit-code -- pkg/protocol
      - run: go mod verify
      - name: Scan dependencies across all packages
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 -scan=package ./...
      - name: Scan independent terminal analyzer dependencies
        run: go -C test/diagnostics/terminalstate/analyzer run golang.org/x/vuln/cmd/govulncheck@v1.1.4 -scan=package ./...
      - name: Complete native product, integration and end-to-end suite
        run: python3 -B scripts/platform-ci.py product --evidence "$RUNNER_TEMP/shiki-platform"
      - name: Verify terminal screen semantics
        run: python3 -B scripts/platform-ci.py terminal --evidence "$RUNNER_TEMP/shiki-platform"
      - name: Native installation, service lifecycle and active upgrade maintenance
        timeout-minutes: 55
        run: python3 -B scripts/platform-ci.py maintenance --evidence "$RUNNER_TEMP/shiki-platform"
      - name: Verify source identity and record final acceptance
        if: always() && steps.checkout.outcome == 'success'
        env:
          SHIKI_PLATFORM_JOB_STATUS: ${{ job.status }}
        run: python3 -B scripts/platform-ci.py finalize --evidence "$RUNNER_TEMP/shiki-platform"
      - uses: actions/upload-artifact@v7.0.2
        if: always() && steps.checkout.outcome == 'success'
        with:
          name: platform-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/shiki-platform/public/**
          if-no-files-found: error
          retention-days: 14
  wsl:
    name: test (WSL2, linux, amd64)
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Native WSL2 product, terminal and systemd maintenance
        id: acceptance
        shell: pwsh
        run: ./scripts/platform-wsl.ps1
      - uses: actions/upload-artifact@v7.0.2
        if: always() && steps.acceptance.outputs.evidence != ''
        with:
          name: platform-wsl2-linux-amd64
          path: ${{ steps.acceptance.outputs.evidence }}/**
          if-no-files-found: error
          retention-days: 14
  compile:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
      - name: Build and verify unsigned release bundle
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          SHIKI_VERSION: v0.0.0-ci
          SHIKI_SIGNING_KEY: ''
          GOMAXPROCS: '2'
          GOFLAGS: '-p=1 -mod=readonly -buildvcs=false'
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          env -u SHIKI_SIGNING_KEY make release
          shiki_archive="shikigami-${SHIKI_VERSION}-${GOOS}-${GOARCH}.tar.gz"
          (
            cd dist
            sha256sum --check "${shiki_archive}.sha256"
            shiki_archived_pin="$(tar -xOf "$shiki_archive" SHA256SUMS | sha256sum | cut -d ' ' -f 1)"
            test "$shiki_archived_pin" = "$(cat "${shiki_archive}.checksums-pin")"
            test ! -e "${shiki_archive}.sig.json"
          )

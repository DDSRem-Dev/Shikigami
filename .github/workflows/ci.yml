name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # PHASE 1: Preflight - Fast validation (build, lint, tool tests)
  # ============================================================================

  preflight:
    name: preflight (${{ matrix.goos }}, ${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15
            goos: darwin
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1 -mod=readonly -buildvcs=false'
      GOTOOLCHAIN: local
      SHIKI_PLATFORM_OS: ${{ matrix.goos }}
      SHIKI_PLATFORM_ARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Identify optional Go cache inputs
        id: cache_keys
        continue-on-error: true
        timeout-minutes: 1
        run: python3 -B scripts/ci_go_cache.py prepare --role native --runner '${{ matrix.runner }}' --target-os '${{ matrix.goos }}' --target-arch '${{ matrix.goarch }}'
      - name: Restore Go modules
        id: module_cache
        if: steps.cache_keys.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.cache_keys.outputs.modules_path }}
          key: ${{ steps.cache_keys.outputs.modules_key }}
      - name: Restore native Go build cache
        id: build_cache
        if: steps.cache_keys.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.cache_keys.outputs.build_path }}
          key: ${{ steps.cache_keys.outputs.build_warm_key }}
          restore-keys: |
            ${{ steps.cache_keys.outputs.build_source_prefix }}
            ${{ steps.cache_keys.outputs.build_prefix }}
      - name: Record restored Go build entries
        id: cache_baseline
        if: steps.module_cache.outcome == 'success' && steps.build_cache.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        env:
          SHIKI_BUILD_CACHE_HIT: ${{ steps.build_cache.outputs.cache-hit }}
          SHIKI_MODULE_CACHE_HIT: ${{ steps.module_cache.outputs.cache-hit }}
          SHIKI_BUILD_CACHE_MATCHED: ${{ steps.build_cache.outputs.cache-matched-key }}
        run: python3 -B scripts/ci_go_cache.py baseline
      - name: Verify platform and freeze source identity
        run: python3 -B scripts/platform-ci.py preflight --evidence "$RUNNER_TEMP/shiki-platform"
      - run: make tools generate-proto
      - name: Check generated protocol drift
        run: git diff --exit-code -- pkg/protocol
      - run: go mod verify
      - name: Scan dependencies across all packages
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 -scan=package ./...
      - name: Scan independent terminal analyzer dependencies
        run: go -C test/diagnostics/terminalstate/analyzer run golang.org/x/vuln/cmd/govulncheck@v1.1.4 -scan=package ./...
      - name: Build and lint
        run: make build lint
      - name: Warm race build cache for subprocess tests
        timeout-minutes: 10
        run: go build -race -buildvcs=false -mod=readonly ./cmd/shiki ./cmd/shiki-agent ./cmd/shiki-daemon ./plugins/sync ./plugins/port
      - name: Test tools
        run: make test-tools
      - name: Test platform tools
        run: python3 -B scripts/test-platform-ci.py
      - name: Record preflight stages for downstream admission
        env:
          SHIKI_EVIDENCE: ${{ runner.temp }}/shiki-platform
        run: |
          set -euo pipefail
          python3 -B scripts/platform-ci.py mark --evidence "$SHIKI_EVIDENCE" --label build-lint
          python3 -B scripts/platform-ci.py mark --evidence "$SHIKI_EVIDENCE" --label tool-tests
          python3 -B scripts/platform-ci.py mark --evidence "$SHIKI_EVIDENCE" --label platform-tool-tests
      - uses: actions/upload-artifact@v7.0.2
        if: always() && steps.checkout.outcome == 'success'
        with:
          name: preflight-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/shiki-platform/public/**
          if-no-files-found: error
          retention-days: 14
      - name: Check optional cache save budget
        id: cache_plan
        if: ${{ !cancelled() && steps.cache_baseline.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          # Reaching this step means the preflight build/lint and acceptance
          # stages completed.  ci_go_cache.py uses these explicit outcomes to
          # decide whether the native caches may be promoted for downstream
          # jobs; without them every preflight run reported no_build.
          SHIKI_CACHE_BUILD_OUTCOME: success
          SHIKI_CACHE_ACCEPTANCE_OUTCOME: success
        run: python3 -B scripts/ci_go_cache.py plan
      - name: Check whether this build cache already exists
        id: cache_present
        if: ${{ !cancelled() && steps.cache_plan.outcome == 'success' && steps.cache_plan.outputs.save_build == 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.cache_keys.outputs.build_path }}
          key: ${{ steps.cache_plan.outputs.build_save_key }}
          lookup-only: true
      - name: Save compiled native Go entries
        if: ${{ !cancelled() && steps.cache_present.outcome == 'success' && steps.cache_present.outputs.cache-hit != 'true' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ steps.cache_keys.outputs.build_path }}
          key: ${{ steps.cache_plan.outputs.build_save_key }}
      - name: Check whether the module cache already exists
        id: modules_present
        if: ${{ !cancelled() && steps.cache_plan.outcome == 'success' && steps.cache_plan.outputs.save_modules == 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.cache_keys.outputs.modules_path }}
          key: ${{ steps.cache_keys.outputs.modules_key }}
          lookup-only: true
      - name: Save downloaded Go modules
        if: ${{ !cancelled() && steps.modules_present.outcome == 'success' && steps.modules_present.outputs.cache-hit != 'true' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ steps.cache_keys.outputs.modules_path }}
          key: ${{ steps.cache_keys.outputs.modules_key }}

  # ============================================================================
  # PHASE 2: Unit Tests - Sharded by package groups for maximum parallelism
  # ============================================================================

  unit-cmd:
    name: unit-cmd (${{ matrix.goos }}, ${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    needs: preflight
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15
            goos: darwin
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1 -mod=readonly -buildvcs=false'
      GOTOOLCHAIN: local
      SHIKI_PLATFORM_OS: ${{ matrix.goos }}
      SHIKI_PLATFORM_ARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
      - name: Install runtime dependencies when absent
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            missing=()
            for command_name in tmux unzip ip openssl; do
              command -v "$command_name" >/dev/null 2>&1 || missing+=("$command_name")
            done
            dpkg-query -W -f='${Status}' dbus-user-session 2>/dev/null | grep -q 'install ok installed' || missing+=(dbus-user-session)
            if ((${#missing[@]})); then
              sudo apt-get update -o Acquire::Retries=3
              sudo apt-get install -y -o Acquire::Retries=3 tmux unzip iproute2 dbus-user-session openssl
            fi
          elif ! command -v tmux >/dev/null 2>&1; then
            brew install tmux
          fi
      - name: Run cmd package tests
        run: go test -count=1 -race -json ./cmd/...

  unit-internal:
    name: unit-internal (${{ matrix.goos }}, ${{ matrix.goarch }})

        timeout-minutes: 5
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            missing=()
            for command_name in tmux unzip ip openssl; do
              command -v "$command_name" >/dev/null 2>&1 || missing+=("$command_name")
            done
            dpkg-query -W -f='${Status}' dbus-user-session 2>/dev/null | grep -q 'install ok installed' || missing+=(dbus-user-session)
            if ((${#missing[@]})); then
              sudo apt-get update -o Acquire::Retries=3
              sudo apt-get install -y -o Acquire::Retries=3 tmux unzip iproute2 dbus-user-session openssl
            fi
          elif ! command -v tmux >/dev/null 2>&1; then
            brew install tmux
          fi
      - name: Pre-fetch Go modules for E2E subprocess builds
        timeout-minutes: 5
        run: go mod download
      - name: Run E2E tests (contains required E2E tests)
        run: go test -count=1 -race -json -tags=e2e ./test/e2e/...

  release-tests:
    name: release-tests (${{ matrix.goos }}, ${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    needs: preflight
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15
            goos: darwin
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1 -mod=readonly -buildvcs=false'
      GOTOOLCHAIN: local
      SHIKI_PLATFORM_OS: ${{ matrix.goos }}
      SHIKI_PLATFORM_ARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
      - name: Run release-trust tests
        run: go test -count=1 -race -json scripts/release-trust.go scripts/release-trust_test.go
      - name: Run release tests
        run: go test -count=1 -race -json scripts/release.go scripts/release_test.go

  embedded-plugins:
    name: embedded-plugins (${{ matrix.goos }}, ${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    needs: preflight
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15
            goos: darwin
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1 -mod=readonly -buildvcs=false -v'
      GOTOOLCHAIN: local
      SHIKI_PLATFORM_OS: ${{ matrix.goos }}
      SHIKI_PLATFORM_ARCH: ${{ matrix.goarch }}
      SHIKI_EMBED_VERIFY: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Identify optional Go cache inputs
        id: cache_keys
        continue-on-error: true
        timeout-minutes: 1
        run: python3 -B scripts/ci_go_cache.py prepare --role native --runner '${{ matrix.runner }}' --target-os '${{ matrix.goos }}' --target-arch '${{ matrix.goarch }}'
      - name: Restore preflight Go modules
        if: steps.cache_keys.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.cache_keys.outputs.modules_path }}
          key: ${{ steps.cache_keys.outputs.modules_key }}
      - name: Restore preflight native Go build cache
        if: steps.cache_keys.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.cache_keys.outputs.build_path }}
          key: ${{ steps.cache_keys.outputs.build_warm_key }}
          restore-keys: |
            ${{ steps.cache_keys.outputs.build_source_prefix }}
            ${{ steps.cache_keys.outputs.build_prefix }}
      - name: Pre-fetch Go modules for embedded build
        timeout-minutes: 5
        run: go mod download
      - name: Test embedded plugins
        run: bash scripts/build-embedded.sh

  # ============================================================================
  # PHASE 5: Terminal & Maintenance
  # ============================================================================

  terminal:
    name: terminal (${{ matrix.goos }}, ${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    needs: [integration-light, integration-heavy, e2e]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: macos-15
            goos: darwin
            goarch: arm64
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1 -mod=readonly -buildvcs=false'
      GOTOOLCHAIN: local
      SHIKI_PLATFORM_OS: ${{ matrix.goos }}
      SHIKI_PLATFORM_ARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
      - uses: actions/download-artifact@v8.0.2
        with:
          name: preflight-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/shiki-platform/public
      - name: Install runtime dependencies when absent
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            missing=()
            for command_name in tmux unzip ip openssl; do
              command -v "$command_name" >/dev/null 2>&1 || missing+=("$command_name")
            done
            dpkg-query -W -f='${Status}' dbus-user-session 2>/dev/null | grep -q 'install ok installed' || missing+=(dbus-user-session)
            if ((${#missing[@]})); then
              sudo apt-get update -o Acquire::Retries=3
              sudo apt-get install -y -o Acquire::Retries=3 tmux unzip iproute2 dbus-user-session openssl
            fi
          elif ! command -v tmux >/dev/null 2>&1; then
            brew install tmux
          fi
      - name: Verify terminal screen semantics
        run: python3 -B scripts/platform-ci.py terminal --evidence "$RUNNER_TEMP/shiki-platform"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: terminal-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/shiki-platform/public/**
          if-no-files-found: error
          retention-days: 14

  maintenance:
    name: maintenance (${{ matrix.goos }}, ${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    needs: [integration-light, integration-heavy, e2e]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: macos-15
            goos: darwin
            goarch: arm64
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1 -mod=readonly -buildvcs=false'
      GOTOOLCHAIN: local
      SHIKI_PLATFORM_OS: ${{ matrix.goos }}
      SHIKI_PLATFORM_ARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
      - uses: actions/download-artifact@v8.0.2
        with:
          name: preflight-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/shiki-platform/public
      - name: Install runtime dependencies when absent
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            missing=()
            for command_name in tmux unzip ip openssl; do
              command -v "$command_name" >/dev/null 2>&1 || missing+=("$command_name")
            done
            dpkg-query -W -f='${Status}' dbus-user-session 2>/dev/null | grep -q 'install ok installed' || missing+=(dbus-user-session)
            if ((${#missing[@]})); then
              sudo apt-get update -o Acquire::Retries=3
              sudo apt-get install -y -o Acquire::Retries=3 tmux unzip iproute2 dbus-user-session openssl
            fi
          elif ! command -v tmux >/dev/null 2>&1; then
            brew install tmux
          fi
      - name: Native installation, service lifecycle and active upgrade maintenance
        run: python3 -B scripts/platform-ci.py maintenance --evidence "$RUNNER_TEMP/shiki-platform"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: maintenance-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/shiki-platform/public/**
          if-no-files-found: error
          retention-days: 14

  # ============================================================================
  # Homebrew Tests (parallel with main flow)
  # ============================================================================

  homebrew:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))
    name: homebrew (${{ matrix.goos }}, ${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - runner: macos-15
            goos: darwin
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
    env:
      SHIKI_CHANNEL_OS: ${{ matrix.goos }}
      SHIKI_CHANNEL_ARCH: ${{ matrix.goarch }}
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test the fixed public Homebrew formula on the native runner
        timeout-minutes: 30
        run: |
          python3 -B scripts/test-homebrew-channel.py run \
            --evidence "$RUNNER_TEMP/shiki-homebrew-channel" --checkout "$GITHUB_WORKSPACE" \
            --os "$SHIKI_CHANNEL_OS" --arch "$SHIKI_CHANNEL_ARCH"
      - name: Finish cleanup of only this run's owned Homebrew objects
        if: always() && steps.checkout.outcome == 'success'
        timeout-minutes: 10
        run: |
          python3 -B scripts/test-homebrew-channel.py cleanup \
            --evidence "$RUNNER_TEMP/shiki-homebrew-channel" \
            --os "$SHIKI_CHANNEL_OS" --arch "$SHIKI_CHANNEL_ARCH"
      - uses: actions/upload-artifact@v7.0.2
        if: always() && steps.checkout.outcome == 'success'
        with:
          name: homebrew-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ runner.temp }}/shiki-homebrew-channel/**
            !${{ runner.temp }}/shiki-homebrew-channel/private/**
          if-no-files-found: warn
          retention-days: 14

  # ============================================================================
  # Compile Tests (cross-compile verification, parallel)
  # ============================================================================

  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
      - name: Build and verify unsigned release bundle
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          SHIKI_VERSION: v0.0.0-ci
          SHIKI_SIGNING_KEY: ''
          GOMAXPROCS: '2'
          GOFLAGS: '-p=1 -mod=readonly -buildvcs=false'
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          env -u SHIKI_SIGNING_KEY make release
          shiki_archive="shikigami-${SHIKI_VERSION}-${GOOS}-${GOARCH}.tar.gz"
          (
            cd dist
            sha256sum --check "${shiki_archive}.sha256"
            shiki_archived_pin="$(tar -xOf "$shiki_archive" SHA256SUMS | sha256sum | cut -d ' ' -f 1)"
            test "$shiki_archived_pin" = "$(cat "${shiki_archive}.checksums-pin")"
            test ! -e "${shiki_archive}.sig.json"
          )

  # ============================================================================
  # WSL2 Tests (Windows-specific, parallel)
  # ============================================================================

  wsl:
    name: test (WSL2, linux, amd64)
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Native WSL2 product, terminal and systemd maintenance
        id: acceptance
        shell: pwsh
        run: ./scripts/platform-wsl.ps1
      - uses: actions/upload-artifact@v7.0.2
        if: always() && steps.acceptance.outputs.evidence != ''
        with:
          name: platform-wsl2-linux-amd64
          path: ${{ steps.acceptance.outputs.evidence }}/**
          if-no-files-found: error
          retention-days: 14

name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read

jobs:
  # ============================================================================
  # PHASE 1: Fast Validation (runs in parallel, fails fast)
  # ============================================================================

  preflight:
    name: preflight (${{ matrix.goos }}, ${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15
            goos: darwin
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1 -mod=readonly -buildvcs=false'
      GOTOOLCHAIN: local
      SHIKI_PLATFORM_OS: ${{ matrix.goos }}
      SHIKI_PLATFORM_ARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Identify optional Go cache inputs
        id: cache_keys
        continue-on-error: true
        timeout-minutes: 1
        run: python3 -B scripts/ci_go_cache.py prepare --role native --runner '${{ matrix.runner }}' --target-os '${{ matrix.goos }}' --target-arch '${{ matrix.goarch }}'
      - name: Restore Go modules
        id: module_cache
        if: steps.cache_keys.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.cache_keys.outputs.modules_path }}
          key: ${{ steps.cache_keys.outputs.modules_key }}
      - name: Restore native Go build cache
        id: build_cache
        if: steps.cache_keys.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.cache_keys.outputs.build_path }}
          key: ${{ steps.cache_keys.outputs.build_warm_key }}
          restore-keys: |
            ${{ steps.cache_keys.outputs.build_source_prefix }}
            ${{ steps.cache_keys.outputs.build_prefix }}
      - name: Record restored Go build entries
        id: cache_baseline
        if: steps.module_cache.outcome == 'success' && steps.build_cache.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        env:
          SHIKI_BUILD_CACHE_HIT: ${{ steps.build_cache.outputs.cache-hit }}
          SHIKI_MODULE_CACHE_HIT: ${{ steps.module_cache.outputs.cache-hit }}
          SHIKI_BUILD_CACHE_MATCHED: ${{ steps.build_cache.outputs.cache-matched-key }}
        run: python3 -B scripts/ci_go_cache.py baseline
      - name: Verify platform and freeze source identity
        run: python3 -B scripts/platform-ci.py preflight --evidence "$RUNNER_TEMP/shiki-platform"
      - run: make tools generate-proto
      - name: Check generated protocol drift
        run: git diff --exit-code -- pkg/protocol
      - run: go mod verify
      - name: Scan dependencies across all packages
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 -scan=package ./...
      - name: Scan independent terminal analyzer dependencies
        run: go -C test/diagnostics/terminalstate/analyzer run golang.org/x/vuln/cmd/govulncheck@v1.1.4 -scan=package ./...
      - name: Build and lint
        run: |
          python3 -B scripts/platform-ci.py product --evidence "$RUNNER_TEMP/shiki-platform" \
            --package-filter ""
        env:
          SKIP_TESTS: "true"
      - uses: actions/upload-artifact@v7.0.2
        if: always() && steps.checkout.outcome == 'success'
        with:
          name: preflight-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/shiki-platform/public/**
          if-no-files-found: error
          retention-days: 14
      - name: Check optional cache save budget
        id: cache_plan
        if: ${{ !cancelled() && steps.cache_baseline.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 1
        run: python3 -B scripts/ci_go_cache.py plan
      - name: Check whether this build cache already exists
        id: cache_present
        if: ${{ !cancelled() && steps.cache_plan.outcome == 'success' && steps.cache_plan.outputs.save_build == 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.cache_keys.outputs.build_path }}
          key: ${{ steps.cache_plan.outputs.build_save_key }}
          lookup-only: true
      - name: Save compiled native Go entries
        if: ${{ !cancelled() && steps.cache_present.outcome == 'success' && steps.cache_present.outputs.cache-hit != 'true' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ steps.cache_keys.outputs.build_path }}
          key: ${{ steps.cache_plan.outputs.build_save_key }}
      - name: Check whether the module cache already exists
        id: modules_present
        if: ${{ !cancelled() && steps.cache_plan.outcome == 'success' && steps.cache_plan.outputs.save_modules == 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.cache_keys.outputs.modules_path }}
          key: ${{ steps.cache_keys.outputs.modules_key }}
          lookup-only: true
      - name: Save downloaded Go modules
        if: ${{ !cancelled() && steps.modules_present.outcome == 'success' && steps.modules_present.outputs.cache-hit != 'true' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ steps.cache_keys.outputs.modules_path }}
          key: ${{ steps.cache_keys.outputs.modules_key }}

  # ============================================================================
  # PHASE 2: Unit Tests (fast, parallel by package groups)
  # ============================================================================

  unit-tests:
    name: unit (${{ matrix.goos }}, ${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    needs: preflight
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15
            goos: darwin
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1 -mod=readonly -buildvcs=false'
      GOTOOLCHAIN: local
      SHIKI_PLATFORM_OS: ${{ matrix.goos }}
      SHIKI_PLATFORM_ARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Restore cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ matrix.goos }}-${{ matrix.goarch }}-
      - uses: actions/download-artifact@v7.0.2
        with:
          name: preflight-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/shiki-platform/public
      - name: Install runtime dependencies
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y tmux unzip iproute2 dbus-user-session openssl
          elif ! command -v tmux; then
            brew install tmux
          fi
      - name: Run unit tests
        run: |
          python3 -B scripts/platform-ci.py product --evidence "$RUNNER_TEMP/shiki-platform" \
            --package-filter "./cmd/...,./internal/...,./pkg/...,./plugins/...,./test/architecture/...,./test/diagnostics/...,./test/fault/...,./test/fixtures/..."
      - uses: actions/upload-artifact@v7.0.2
        if: always() && steps.checkout.outcome == 'success'
        with:
          name: unit-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/shiki-platform/public/**
          if-no-files-found: error
          retention-days: 14

  # ============================================================================
  # PHASE 3: Integration Tests (medium weight, parallel)
  # ============================================================================

  integration-light:
    name: integration-light (${{ matrix.goos }}, ${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    needs: preflight
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15
            goos: darwin
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1 -mod=readonly -buildvcs=false'
      GOTOOLCHAIN: local
      SHIKI_PLATFORM_OS: ${{ matrix.goos }}
      SHIKI_PLATFORM_ARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Restore cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ matrix.goos }}-${{ matrix.goarch }}-
      - uses: actions/download-artifact@v7.0.2
        with:
          name: preflight-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/shiki-platform/public
      - name: Install runtime dependencies
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y tmux unzip iproute2 dbus-user-session openssl
          elif ! command -v tmux; then
            brew install tmux
          fi
      - name: Run light integration tests
        run: |
          python3 -B scripts/platform-ci.py product --evidence "$RUNNER_TEMP/shiki-platform" \
            --package-filter "./test/integration/admission/...,./test/integration/agent/...,./test/integration/daemon/...,./test/integration/port/...,./test/integration/terminalstate/...,./test/integration/embedded/..."
      - uses: actions/upload-artifact@v7.0.2
        if: always() && steps.checkout.outcome == 'success'
        with:
          name: integration-light-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/shiki-platform/public/**
          if-no-files-found: error
          retention-days: 14

  integration-heavy:
    name: integration-heavy (${{ matrix.goos }}, ${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    needs: [preflight, unit-tests]
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15
            goos: darwin
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1 -mod=readonly -buildvcs=false'
      GOTOOLCHAIN: local
      SHIKI_PLATFORM_OS: ${{ matrix.goos }}
      SHIKI_PLATFORM_ARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Restore cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ matrix.goos }}-${{ matrix.goarch }}-
      - uses: actions/download-artifact@v7.0.2
        with:
          name: preflight-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/shiki-platform/public
      - name: Install runtime dependencies
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y tmux unzip iproute2 dbus-user-session openssl
          elif ! command -v tmux; then
            brew install tmux
          fi
      - name: Run heavy integration tests (includes required tests)
        run: |
          python3 -B scripts/platform-ci.py product --evidence "$RUNNER_TEMP/shiki-platform" \
            --package-filter "./test/integration/hostrotation/...,./test/integration/rotation/...,./test/integration/plugin/...,./test/integration/syncack/...,./test/integration/sync/...,./test/integration/version/..."
      - uses: actions/upload-artifact@v7.0.2
        if: always() && steps.checkout.outcome == 'success'
        with:
          name: integration-heavy-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/shiki-platform/public/**
          if-no-files-found: error
          retention-days: 14

  # ============================================================================
  # PHASE 4: E2E Tests (heaviest, run after integration)
  # ============================================================================

  e2e-tests:
    name: e2e (${{ matrix.goos }}, ${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    needs: [preflight, unit-tests, integration-light]
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15
            goos: darwin
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1 -mod=readonly -buildvcs=false'
      GOTOOLCHAIN: local
      SHIKI_PLATFORM_OS: ${{ matrix.goos }}
      SHIKI_PLATFORM_ARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Restore cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ matrix.goos }}-${{ matrix.goarch }}-
      - uses: actions/download-artifact@v7.0.2
        with:
          name: preflight-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/shiki-platform/public
      - name: Install runtime dependencies
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y tmux unzip iproute2 dbus-user-session openssl
          elif ! command -v tmux; then
            brew install tmux
          fi
      - name: Run E2E tests (includes required E2E tests)
        run: |
          python3 -B scripts/platform-ci.py product --evidence "$RUNNER_TEMP/shiki-platform" \
            --package-filter "./test/e2e/..."
      - uses: actions/upload-artifact@v7.0.2
        if: always() && steps.checkout.outcome == 'success'
        with:
          name: e2e-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/shiki-platform/public/**
          if-no-files-found: error
          retention-days: 14

  # ============================================================================
  # PHASE 5: Terminal & Maintenance (only after core tests pass)
  # ============================================================================

  terminal:
    name: terminal (${{ matrix.goos }}, ${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    needs: [unit-tests, integration-light, integration-heavy, e2e-tests]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: macos-15
            goos: darwin
            goarch: arm64
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1 -mod=readonly -buildvcs=false'
      GOTOOLCHAIN: local
      SHIKI_PLATFORM_OS: ${{ matrix.goos }}
      SHIKI_PLATFORM_ARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Restore cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ matrix.goos }}-${{ matrix.goarch }}-
      - uses: actions/download-artifact@v7.0.2
        with:
          name: preflight-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/shiki-platform/public
      - name: Verify terminal screen semantics
        run: python3 -B scripts/platform-ci.py terminal --evidence "$RUNNER_TEMP/shiki-platform"
      - uses: actions/upload-artifact@v7.0.2
        if: always() && steps.checkout.outcome == 'success'
        with:
          name: terminal-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/shiki-platform/public/**
          if-no-files-found: error
          retention-days: 14

  maintenance:
    name: maintenance (${{ matrix.goos }}, ${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    needs: [unit-tests, integration-light, integration-heavy, e2e-tests]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: macos-15
            goos: darwin
            goarch: arm64
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1 -mod=readonly -buildvcs=false'
      GOTOOLCHAIN: local
      SHIKI_PLATFORM_OS: ${{ matrix.goos }}
      SHIKI_PLATFORM_ARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Restore cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ matrix.goos }}-${{ matrix.goarch }}-
      - uses: actions/download-artifact@v7.0.2
        with:
          name: preflight-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/shiki-platform/public
      - name: Install runtime dependencies
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y tmux unzip iproute2 dbus-user-session openssl
          elif ! command -v tmux; then
            brew install tmux
          fi
      - name: Native installation, service lifecycle and active upgrade maintenance
        run: python3 -B scripts/platform-ci.py maintenance --evidence "$RUNNER_TEMP/shiki-platform"
      - uses: actions/upload-artifact@v7.0.2
        if: always() && steps.checkout.outcome == 'success'
        with:
          name: maintenance-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/shiki-platform/public/**
          if-no-files-found: error
          retention-days: 14

  # ============================================================================
  # Homebrew Tests (parallel with main flow)
  # ============================================================================

  homebrew:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))
    name: homebrew (${{ matrix.goos }}, ${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - runner: macos-15
            goos: darwin
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
    env:
      SHIKI_CHANNEL_OS: ${{ matrix.goos }}
      SHIKI_CHANNEL_ARCH: ${{ matrix.goarch }}
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test the fixed public Homebrew formula on the native runner
        timeout-minutes: 30
        run: |
          python3 -B scripts/test-homebrew-channel.py run \
            --evidence "$RUNNER_TEMP/shiki-homebrew-channel" --checkout "$GITHUB_WORKSPACE" \
            --os "$SHIKI_CHANNEL_OS" --arch "$SHIKI_CHANNEL_ARCH"
      - name: Finish cleanup of only this run's owned Homebrew objects
        if: always() && steps.checkout.outcome == 'success'
        timeout-minutes: 10
        run: |
          python3 -B scripts/test-homebrew-channel.py cleanup \
            --evidence "$RUNNER_TEMP/shiki-homebrew-channel" \
            --os "$SHIKI_CHANNEL_OS" --arch "$SHIKI_CHANNEL_ARCH"
      - uses: actions/upload-artifact@v7.0.2
        if: always() && steps.checkout.outcome == 'success'
        with:
          name: homebrew-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ runner.temp }}/shiki-homebrew-channel/**
            !${{ runner.temp }}/shiki-homebrew-channel/private/**
          if-no-files-found: warn
          retention-days: 14

  # ============================================================================
  # Compile Tests (cross-compile verification, parallel)
  # ============================================================================

  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Restore cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-compile-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-compile-${{ matrix.goos }}-${{ matrix.goarch }}-
      - name: Build and verify unsigned release bundle
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          SHIKI_VERSION: v0.0.0-ci
          SHIKI_SIGNING_KEY: ''
          GOMAXPROCS: '2'
          GOFLAGS: '-p=1 -mod=readonly -buildvcs=false'
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          env -u SHIKI_SIGNING_KEY make release
          shiki_archive="shikigami-${SHIKI_VERSION}-${GOOS}-${GOARCH}.tar.gz"
          (
            cd dist
            sha256sum --check "${shiki_archive}.sha256"
            shiki_archived_pin="$(tar -xOf "$shiki_archive" SHA256SUMS | sha256sum | cut -d ' ' -f 1)"
            test "$shiki_archived_pin" = "$(cat "${shiki_archive}.checksums-pin")"
            test ! -e "${shiki_archive}.sig.json"
          )

  # ============================================================================
  # WSL2 Tests (Windows-specific, parallel)
  # ============================================================================

  wsl:
    name: test (WSL2, linux, amd64)
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Native WSL2 product, terminal and systemd maintenance
        id: acceptance
        shell: pwsh
        run: ./scripts/platform-wsl.ps1
      - uses: actions/upload-artifact@v7.0.2
        if: always() && steps.acceptance.outputs.evidence != ''
        with:
          name: platform-wsl2-linux-amd64
          path: ${{ steps.acceptance.outputs.evidence }}/**
          if-no-files-found: error
          retention-days: 14

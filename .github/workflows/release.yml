name: Release
run-name: Release ${{ github.ref_name }}
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  GOMAXPROCS: '2'
  GOFLAGS: '-p=1 -mod=readonly -buildvcs=false'
  GOTOOLCHAIN: local
jobs:
  source:
    if: github.repository == 'DDSRem-Dev/Shikigami'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
      version: ${{ steps.tag.outputs.version }}
      built_at: ${{ steps.tag.outputs.built_at }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate immutable version tag and master ancestry
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/release-actions.py tag \
            --repository "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --output "$GITHUB_OUTPUT"
  checks:
    needs: source
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
  build:
    needs: [source, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
      - name: Build unsigned fixed-source bundle
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          SHIKI_VERSION: ${{ needs.source.outputs.version }}
          SHIKI_COMMIT: ${{ needs.source.outputs.commit }}
          SHIKI_BUILT_AT: ${{ needs.source.outputs.built_at }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SHIKI_COMMIT"
          env -u SHIKI_SIGNING_KEY make release
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: unsigned-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true
  sign:
    needs: [source, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-signing
    steps:
      # Only the tested tag source runs; the private key is exposed in one step.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: unsigned-*
          path: unsigned
          merge-multiple: true
      - name: Validate all bundles and build trusted verifier without signing key
        env:
          RELEASE_VERSION: ${{ needs.source.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/release-actions.py bundles --directory unsigned --version "$RELEASE_VERSION" > "$RUNNER_TEMP/bundles.json"
          go build -trimpath -o "$RUNNER_TEMP/release-trust" ./scripts/release-trust.go
      - name: Recheck tag before exposing the signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release-actions.py tag \
            --repository "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
      - name: Sign and independently verify each target
        env:
          SHIKI_RELEASE_SIGNING_KEY: ${{ secrets.SHIKI_RELEASE_SIGNING_KEY }}
          SHIKI_RELEASE_PUBLIC_KEY: ${{ vars.SHIKI_RELEASE_PUBLIC_KEY }}
          RELEASE_VERSION: ${{ needs.source.outputs.version }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
        run: |
          set -euo pipefail
          umask 077
          shiki_key_dir="$(mktemp -d "$RUNNER_TEMP/shiki-signing.XXXXXX")"
          trap 'rm -rf "$shiki_key_dir"' EXIT
          test -n "$SHIKI_RELEASE_SIGNING_KEY"
          test -n "$SHIKI_RELEASE_PUBLIC_KEY"
          printf '%s\n' "$SHIKI_RELEASE_SIGNING_KEY" > "$shiki_key_dir/private.pem"
          printf '%s\n' "$SHIKI_RELEASE_PUBLIC_KEY" > "$shiki_key_dir/public.pem"
          unset SHIKI_RELEASE_SIGNING_KEY SHIKI_RELEASE_PUBLIC_KEY
          openssl pkey -pubin -in configs/release-signing.pub -outform DER -out "$shiki_key_dir/expected.der"
          openssl pkey -pubin -in "$shiki_key_dir/public.pem" -outform DER -out "$shiki_key_dir/configured.der"
          cmp "$shiki_key_dir/expected.der" "$shiki_key_dir/configured.der"
          mkdir signed
          for shiki_os in linux darwin; do
            for shiki_arch in amd64 arm64; do
              shiki_name="shikigami-${RELEASE_VERSION}-${shiki_os}-${shiki_arch}.tar.gz"
              "$RUNNER_TEMP/release-trust" sign \
                --archive "unsigned/$shiki_name" --checksums-pin "unsigned/$shiki_name.checksums-pin" \
                --private-key "$shiki_key_dir/private.pem" --signature "signed/$shiki_name.sig.json" \
                --version "$RELEASE_VERSION" --os "$shiki_os" --arch "$shiki_arch"
              "$RUNNER_TEMP/release-trust" verify \
                --archive "unsigned/$shiki_name" --signature "signed/$shiki_name.sig.json" \
                --public-key configs/release-signing.pub --output "$shiki_key_dir/verified-$shiki_os-$shiki_arch" \
                --version "$RELEASE_VERSION" --os "$shiki_os" --arch "$shiki_arch" > "$shiki_key_dir/receipt.json"
              cp "$shiki_key_dir/verified-$shiki_os-$shiki_arch/$shiki_name" "signed/$shiki_name"
              cp "unsigned/$shiki_name.sha256" "unsigned/$shiki_name.checksums-pin" signed/
              jq 'del(.archive)' "$shiki_key_dir/receipt.json" > "signed/$shiki_name.verification.json"
            done
          done
          cp configs/release-signing.pub signed/release-signing.pub
          jq -n --arg version "$RELEASE_VERSION" --arg commit "$SOURCE_COMMIT" \
            --arg signer "$GITHUB_SHA" --arg repository "$GITHUB_REPOSITORY" \
            --arg tag "$RELEASE_VERSION" --arg release_run "$GITHUB_RUN_ID" \
            '{version:$version, source_commit:$commit, signing_workflow_commit:$signer, repository:$repository, tag:$tag, release_run_id:$release_run}' \
            > signed/PROVENANCE.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: signed-${{ needs.source.outputs.version }}
          path: signed/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true
  publish:
    needs: [source, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: signed-${{ needs.source.outputs.version }}
          path: signed
      - name: Build trusted verifier without publication token
        run: go build -trimpath -o "$RUNNER_TEMP/release-trust" ./scripts/release-trust.go
      - name: Verify signatures and publish the complete release from a draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.source.outputs.version }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          python3 scripts/release-publish.py \
            --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" \
            --commit "$SOURCE_COMMIT" --run-id "$GITHUB_RUN_ID" \
            --directory signed --verifier "$RUNNER_TEMP/release-trust" \
            --public-key configs/release-signing.pub --notes-directory docs/releases

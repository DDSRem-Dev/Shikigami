<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shikigami remote browser</title>
  <link rel="stylesheet" href="/assets/viewer.css">
  <script src="/bootstrap.js" defer></script>
</head>
<body class="bootstrap">
  <main>
    <h1>Shikigami remote browser</h1>
    <p id="bootstrap-status" role="status">Opening the one-use viewer link…</p>

  </main>
